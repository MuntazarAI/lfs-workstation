<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">LFS Workstation — Build Linux from the source up</title>
<desc id="desc">Original workstation engineering banner showing a layered Linux system diagram, terminal-inspired build output, and a cool slate and green palette.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d12"/><stop offset=".58" stop-color="#101d27"/><stop offset="1" stop-color="#0a1418"/></linearGradient>
<linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8be28a"/><stop offset=".55" stop-color="#53d6b0"/><stop offset="1" stop-color="#b8f5c4"/></linearGradient>
<pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#9adab0" stroke-opacity=".06"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="520" rx="26" fill="url(#bg)"/><rect width="1600" height="520" rx="26" fill="url(#grid)"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="95" y="140" fill="#f2f8f5" font-size="64" font-weight="700" letter-spacing="2">LFS WORKSTATION</text>
<text x="100" y="190" fill="#91e9a2" font-family="monospace" font-size="20" letter-spacing="3">LINUX FROM SOURCE · BUILT STEP BY STEP</text>
<text x="100" y="235" fill="#bdcbd2" font-size="19">A reproducible, documented Linux engineering journey</text>
<path d="M100 270H620" stroke="url(#green)" stroke-width="3"/>
<text x="100" y="310" fill="#91a9b5" font-family="monospace" font-size="16">LFS 13.1-SYSTEMD  /  BLFS 13.1</text>
<text x="100" y="340" fill="#91a9b5" font-family="monospace" font-size="16">VERIFY · DOCUMENT · IMPROVE</text>
</g>
<g transform="translate(970 68)">
<rect width="520" height="370" rx="18" fill="#050b0f" fill-opacity=".92" stroke="#7bdc9a" stroke-opacity=".38"/>
<rect x="1" y="1" width="518" height="42" rx="17" fill="#16262a"/>
<circle cx="25" cy="22" r="5" fill="#f38b7a"/><circle cx="45" cy="22" r="5" fill="#e7c66b"/><circle cx="65" cy="22" r="5" fill="#85dc9a"/>
<text x="90" y="27" fill="#a5c6b2" font-family="monospace" font-size="13">lfs-build / progress-map</text>
<g font-family="monospace" font-size="15">
<text x="28" y="82" fill="#8be28a">$ system foundation</text>
<rect x="28" y="97" width="210" height="34" rx="6" fill="#163a2d" stroke="#6cd58a" stroke-opacity=".7"/><text x="42" y="119" fill="#b7f6c5">01  LFS base</text>
<rect x="258" y="97" width="230" height="34" rx="6" fill="#163a2d" stroke="#6cd58a" stroke-opacity=".7"/><text x="272" y="119" fill="#b7f6c5">02  Toolchain</text>
<path d="M133 131v22h240v-22" fill="none" stroke="#7bdc9a" stroke-opacity=".55" stroke-width="2"/>
<rect x="28" y="157" width="460" height="34" rx="6" fill="#18313a" stroke="#69c6c9" stroke-opacity=".65"/><text x="42" y="179" fill="#bceff0">03  Kernel + system services</text>
<rect x="28" y="205" width="460" height="34" rx="6" fill="#18313a" stroke="#69c6c9" stroke-opacity=".65"/><text x="42" y="227" fill="#bceff0">04  Graphics + input stack</text>
<rect x="28" y="253" width="460" height="34" rx="6" fill="#263127" stroke="#b4c98b" stroke-opacity=".65"/><text x="42" y="275" fill="#e2edc7">05  Lightweight desktop (next)</text>
<text x="28" y="323" fill="#8be28a" filter="url(#glow)">&gt; small steps, verified results_</text>
<text x="28" y="348" fill="#6f8990" font-size="12">ILLUSTRATIVE ROADMAP — NOT A LIVE SCREENSHOT</text>
</g>
</g>
<path d="M70 465H1530" stroke="#7bdc9a" stroke-opacity=".22"/>
<text x="80" y="492" fill="#6f978d" font-family="monospace" font-size="12" letter-spacing="2">OPEN ENGINEERING LOG • REPRODUCIBLE BUILDS • LEARN IN PUBLIC</text>
</svg>